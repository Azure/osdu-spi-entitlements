# Logging configuration
logging.level.org.springframework.web=DEBUG

# Spring configuration
spring.main.lazy-initialization=true
spring.jackson.mapper.accept_case_insensitive_properties=true
# Spring Boot 4: keep Jackson 2 (ConfigMapper ObjectMapper) for HTTP message conversion so the release API contract is unchanged
spring.http.converters.preferred-json-mapper=jackson2

# App configuration
app.projectId=evd-ddl-us-services
app.domain=contoso.com

server.servlet.contextPath=/api/entitlements/v2